<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser tints its own toolbar/tab strip to this, rather than
         sampling the top of the page. Without it, the operator banner pinned at
         the very top bled its bronze into the browser chrome. Matches the
         page background (--bg) in each theme. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <title>Guest Badges</title>
    <meta
      name="description"
      content="A sign-in kiosk that prints a name badge. Visitors enter their name at the door and a badge is waiting for them."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
